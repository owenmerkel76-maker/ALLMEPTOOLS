name: Validate master repository
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bash CODEX_SETUP.sh
        id: validate
        run: |
          set -o pipefail
          bash CODEX_SETUP.sh 2>&1 | tee "$RUNNER_TEMP/robmep-validation.log"
      - name: Annotate validation failure
        if: failure() && steps.validate.outcome == 'failure'
        shell: python
        run: |
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'robmep-validation.log'
          message = log.read_text(errors='replace')[-60000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Offline validation failure::' + message)
